# Real-hardware initial conditions for Case-4 (collision avoidance: ON).
# Same IC family as Case-3, but collision avoidance fixes the near-collision.
# x, y in metres, yaw in radians, world frame. First logged row of the real
# APS Report/Figures/Case-4/log_data.csv run.
case: Case-4
collision_avoidance: true
conv_tol: 0.050
# Real run converged at ~203.0s; generous margin for Gazebo dynamics differing
# from the real unicycle/EKF loop.
max_duration: 280.0
robots:
  bot_0: {x: -0.3034, y: -0.0093, yaw: 0.6830}
  bot_1: {x: -0.6136, y: 0.4315, yaw: -0.9821}
  bot_2: {x: 0.1132, y: -0.2382, yaw: 2.1886}
  bot_3: {x: -0.3801, y: -0.3463, yaw: -2.1991}
