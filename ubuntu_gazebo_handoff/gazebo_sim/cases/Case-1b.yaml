# Real-hardware initial conditions for Case-1b (law_variant 3: raw-E-driven,
# no collision avoidance, 10,000,000 gain -- per
# multi_unicycle_controller_double_angle.py's "Variant 3").
# x, y in metres, yaw in radians, world frame. First logged row of the real
# APS Report/Figures/Case-1b/log_data.csv run.
case: Case-1b
law_variant: 3
conv_tol: 0.050
# Real run converged at ~154.7s; generous margin for Gazebo dynamics differing
# from the real unicycle/EKF loop.
max_duration: 260.0
robots:
  bot_0: {x: 0.6705, y: 0.1398, yaw: 1.4427}
  bot_1: {x: -0.6370, y: 0.1786, yaw: 1.6645}
  bot_2: {x: -0.6128, y: -0.1347, yaw: -1.2970}
  bot_3: {x: 0.6413, y: -0.1755, yaw: -1.4689}
