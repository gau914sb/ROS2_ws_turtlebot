# Bridge config for bot_9
# gz topics are prefixed by model name automatically in Gazebo Harmonic

- ros_topic_name: "/bot_9/cmd_vel"
  gz_topic_name: "/bot_9/cmd_vel"
  ros_type_name: "geometry_msgs/msg/Twist"
  gz_type_name: "gz.msgs.Twist"
  direction: ROS_TO_GZ

- ros_topic_name: "/bot_9/odom"
  gz_topic_name: "/bot_9/ground_truth_odom"
  ros_type_name: "nav_msgs/msg/Odometry"
  gz_type_name: "gz.msgs.Odometry"
  direction: GZ_TO_ROS

- ros_topic_name: "/bot_9/tf"
  gz_topic_name: "/bot_9/tf"
  ros_type_name: "tf2_msgs/msg/TFMessage"
  gz_type_name: "gz.msgs.Pose_V"
  direction: GZ_TO_ROS

- ros_topic_name: "/bot_9/joint_states"
  gz_topic_name: "/bot_9/joint_states"
  ros_type_name: "sensor_msgs/msg/JointState"
  gz_type_name: "gz.msgs.Model"
  direction: GZ_TO_ROS
